[package]
name = "vss-android"
edition = "2018"
version = "1.0.0"
authors = ["The Visual System Simulator Developers"]
license = "Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
ash = { workspace = true }
naga = { version = "29", features = ["wgsl-in", "spv-out"] }
wgpu = { workspace = true }
wgpu-hal = { workspace = true }
raw-window-handle = { workspace = true }
vss = { path = "../vss" }
lazy_static = "1.5.0"
log = "0.4"
futures = "0.3"

[target.'cfg(target_os="android")'.dependencies]
jni = "0.22"
ndk = "0.9.0"
ndk-sys = "0.6.0"
android_logger = "0.15.1"

[package.metadata.android.sdk]
min_sdk_version = 31
target_sdk_version = 37
