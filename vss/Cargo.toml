[package]
name = "vss"
version = "1.0.0"
edition = "2021"
authors = ["The Visual System Simulator Developers"]
license = "Apache-2.0"
resolver = "2"

[dependencies]
cgmath = { workspace = true }
raw-window-handle = { workspace = true }
wgpu = { workspace = true }
egui = "0.27"
egui-wgpu = "0.27"
image = "0.25"
bitflags = "2.5"
futures-intrusive = "0.5"
serde_json = "*"
serde = "1"
instant = "0.1"
pollster = "0.3"

[features]
webgl = ["wgpu/webgl"]
