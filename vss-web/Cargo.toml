[package]
name = "vss-web"
edition = "2018"
version = "1.0.0"
authors = ["The Visual System Simulator Developers"]
license = "Apache-2.0"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["cdylib"]

[dependencies]
vss = { path = "../vss", features = ['webgl'] }
vss-catalog = { path = "../vss-catalog" }
console_error_panic_hook = "0.1.7"
console_log = "1"
instant = { version = "0.1.13", features = ["wasm-bindgen"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
serde_json = "1"
web-sys = { version = "0.3", features = ['console', 'Document', 'Element', 'HtmlCanvasElement', 'Window'] }
wgpu = { workspace = true }
