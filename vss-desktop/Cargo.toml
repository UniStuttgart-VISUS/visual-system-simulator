[package]
name = "vss-desktop"
edition = "2018"
version = "1.0.0"
authors = ["The Visual System Simulator Developers"]
license = "Apache-2.0"
description = "Desktop application for the Visual System Simulator"
repository = "https://github.com/UniStuttgart-VISUS/visual-system-simulator"

[package.metadata.bundle]
name = "Visual System Simulator"
identifier = "de.uni-stuttgart.visus.vss"
icon = [
    "packaging/icons/windows/app.ico",
    "packaging/icons/linux/hicolor/*x*/apps/vss.png",
    "packaging/icons/macos/app.iconset/*.png",
]
category = "Education"
short_description = "Simulates the visual system and visual impairments"

[dependencies]
wgpu = { workspace = true }
vss = { path = "../vss" }
vss-winit = { path = "../vss-winit" }
vss-openxr = { path = "../vss-openxr" }
vss-catalog = { path = "../vss-catalog" }
pollster = "0.4"
clap = { version = "4", features = ["derive"] }
glob = "0.3"
ac_ffmpeg = { package = "ac-ffmpeg", version = "0.19.0", optional = true }
rfd = "0.15"
tempfile = "3"
egui = "0.34"
egui-wgpu = "0.34"
egui-winit = "0.34"
serde_json = "1"
sys-locale = "0.3"
rust-i18n = { workspace = true }
winit = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }

[features]
default = []
video = ["ac_ffmpeg"]

[build-dependencies]
winresource = "0.1"
