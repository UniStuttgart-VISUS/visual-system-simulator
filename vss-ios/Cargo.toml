[package]
name = "vss-ios"
edition = "2021"
version = "1.0.0"
license = "Apache-2.0"

[lib]
crate-type = ["staticlib"]

[dependencies]
vss = { path = "../vss" }
vss-catalog = { path = "../vss-catalog" }
wgpu = { workspace = true }
wgpu-hal = { workspace = true }
raw-window-handle = { workspace = true }
serde_json = "1"
log = "0.4"

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
objc2-metal = "0.3"
oslog = "0.2"

