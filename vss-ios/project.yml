name: VSS
options:
  bundleIdPrefix: de.uni-stuttgart.visus
  deploymentTarget: { iOS: "17.0" }
settings:
  base:
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
targets:
  VSS:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/VSS.xcconfig
      Release: Config/VSS.xcconfig
    sources:
      - path: App
      - path: ../vss-catalog/presets
        type: folder
        buildPhase: resources
      - path: ../vss-catalog/articles
        type: folder
        buildPhase: resources
    settings:
      base:
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LIBRARY_SEARCH_PATHS: "$(inherited) $(SRCROOT)/build/rust/$(PLATFORM_NAME)"
        OTHER_LDFLAGS: "$(inherited) -lvss_ios -lc++"
    dependencies:
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: AVFoundation.framework
      - sdk: CoreMedia.framework
      - sdk: CoreVideo.framework
      - sdk: IOSurface.framework
      - sdk: WebKit.framework
    preBuildScripts:
      - name: Build Rust core
        script: ./scripts/build-rust.sh
        basedOnDependencyAnalysis: false
  VSSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: VSS
